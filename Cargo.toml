[package]
name = "dirwatch"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dirwatch"
path = "src/main.rs"

[features]
default = []
sim-support = []
fault-injection = []
expose-internals = []

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
globset = "0.4"
metrics = "0.24"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
