[package]
name = "dirwatch"
version = "0.1.0"
edition = "2021"
description = "Cross-platform directory watcher with bounded queues and backpressure policies"
license = "MIT"
repository = "https://github.com/Cordagr/inotify"
readme = "README.md"
keywords = ["filesystem", "watcher", "notify", "events"]
categories = ["filesystem", "command-line-utilities"]
exclude = [".github/**", ".gitignore"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "dirwatch"
path = "src/main.rs"

[[bench]]
name = "watcher_compare"
harness = false

[features]
default = []
sim-support = []
fault-injection = []
expose-internals = []

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
globset = "0.4"
metrics = "0.24"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
